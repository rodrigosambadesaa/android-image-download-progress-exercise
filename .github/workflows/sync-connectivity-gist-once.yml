name: Sync full Connectivity Gist once

on:
  push:
    paths:
      - '.github/workflows/sync-connectivity-gist-once.yml'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch exact pinned Gist source
        shell: bash
        env:
          GIST_URL: https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ce7bd07ed17d10d48785a0c21527c8100ea6da7e/ConnectivityAndInternetAccess.java
          DEST: app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$GIST_URL" -o /tmp/ConnectivityAndInternetAccess.java
          line_count="$(wc -l < /tmp/ConnectivityAndInternetAccess.java)"
          echo "Fetched ConnectivityAndInternetAccess.java: ${line_count} lines"
          test "$line_count" -ge 1700
          grep -q 'public static NetworkObserver observeNetwork' /tmp/ConnectivityAndInternetAccess.java
          grep -q 'public Request checkInternetAsync' /tmp/ConnectivityAndInternetAccess.java
          grep -q 'public static Builder strictCaptivePortalBuilder' /tmp/ConnectivityAndInternetAccess.java
          mkdir -p "$(dirname "$DEST")"
          cp /tmp/ConnectivityAndInternetAccess.java "$DEST"
          sha256sum "$DEST"

      - name: Commit exact vendored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java
          if git diff --cached --quiet; then
            echo 'Vendored source already matches the pinned Gist exactly.'
            exit 0
          fi
          git commit -m 'fix: vendor complete current ConnectivityAndInternetAccess Gist'
          git push
