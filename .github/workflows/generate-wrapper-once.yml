name: Generate Gradle Wrapper once

on:
  push:
    paths:
      - '.github/workflows/generate-wrapper-once.yml'

permissions:
  contents: write

jobs:
  generate-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'

      - name: Generate exact Gradle 9.5.0 wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle wrapper --gradle-version 9.5.0 --distribution-type bin
          test -f gradlew
          test -f gradlew.bat
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git commit -m 'fix: add Gradle 9.5.0 wrapper for fresh clones'
          git push
