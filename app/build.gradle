plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.rodri.ejercicio3asynctask'
    compileSdk 37

    defaultConfig {
        applicationId 'com.example.rodri.ejercicio3asynctask'
        minSdk 23
        targetSdk 37
        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        // ConnectivityAndInternetAccess uses Java library APIs that arrived on the
        // Android platform after API 23 (for example AtomicInteger.updateAndGet).
        // Core library desugaring backports supported java.* APIs for older devices.
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    testImplementation 'junit:junit:4.13.2'
}
