name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The project source/target compatibility remains Java 17. Gradle/Lint runs on
      # JDK 21 because AGP 9.3's bundled lint parser can call JDK 21 List APIs.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Validate, test and build
        run: gradle --no-daemon testDebugUnitTest lintDebug assembleDebug
