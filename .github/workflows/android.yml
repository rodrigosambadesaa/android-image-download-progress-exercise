name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

# CVE-2026-114938: mitigate affected Base64 intrinsic in JDK 21 Android builds.
env:
  JAVA_TOOL_OPTIONS: -XX:-UseBASE64Intrinsics

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Verify vendored ConnectivityAndInternetAccess Gist
        shell: bash
        env:
          GIST_URL: https://gist.githubusercontent.com/rodrigosambadesaa/729cca29a031fef4e2f15751863b655f/raw/ce7bd07ed17d10d48785a0c21527c8100ea6da7e/ConnectivityAndInternetAccess.java
          VENDORED_FILE: app/src/main/java/net/i2p/android/router/util/ConnectivityAndInternetAccess.java
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 "$GIST_URL" -o /tmp/ConnectivityAndInternetAccess.java
          test "$(wc -l < /tmp/ConnectivityAndInternetAccess.java)" -ge 1700
          cmp --silent /tmp/ConnectivityAndInternetAccess.java "$VENDORED_FILE" || {
            echo 'Vendored ConnectivityAndInternetAccess.java differs from the pinned Gist revision.' >&2
            diff -u /tmp/ConnectivityAndInternetAccess.java "$VENDORED_FILE" | head -200 || true
            exit 1
          }
          echo "Exact pinned Gist match: $(sha256sum "$VENDORED_FILE" | cut -d' ' -f1)"

      # The project source/target compatibility remains Java 17. Gradle/Lint runs on
      # JDK 21 because AGP 9.3's bundled lint parser can call JDK 21 List APIs.
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Verify committed Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -x ./gradlew
          grep -q 'gradle-9.5.0-bin.zip' gradle/wrapper/gradle-wrapper.properties
          ./gradlew --no-daemon --version | tee /tmp/gradle-version.txt
          grep -q 'Gradle 9.5.0' /tmp/gradle-version.txt

      - name: Validate, test and build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
